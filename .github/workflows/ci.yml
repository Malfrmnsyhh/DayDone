name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: daydone
          POSTGRES_PASSWORD: daydone_test_password
          POSTGRES_DB: daydone_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: |
          cp apps/api/.env.test.example apps/api/.env.test
          pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://daydone:daydone_test_password@localhost:5433/daydone_test

      - name: Run linter
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://daydone:daydone_test_password@localhost:5433/daydone_test

      - name: Run security audit
        run: pnpm audit --audit-level high
